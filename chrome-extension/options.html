<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Gnotch for WhatsApp Web</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 24px; max-width: 420px; color: #222; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; }
  button { margin-top: 16px; padding: 8px 16px; font: inherit; }
  #status { margin-top: 16px; color: #555; }
  @media (prefers-color-scheme: dark) { body { background: #1e1e1e; color: #eee; } #status { color: #aaa; } }
</style>
</head>
<body>
<h2>Gnotch for WhatsApp Web</h2>
<p>Copy the pairing token from <b>Gnotch preferences → WhatsApp</b>.</p>
<label for="token">Pairing token</label>
<input id="token" autocomplete="off" spellcheck="false">
<label for="port">Port</label>
<input id="port" type="number" min="1024" max="65535">
<button id="save">Save</button>
<div id="status"></div>
<script src="options.js"></script>
</body>
</html>
